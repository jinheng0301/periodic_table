<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05070b" />
    <title>Periodic Table</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
      }
    </script>
    <script async defer src="https://accounts.google.com/gsi/client"></script>
  </head>
  <body>
    <main id="login-view" class="login-view">
      <section class="login-card" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">P</div>
        <h1 id="login-title">Welcome Back</h1>
        <p class="login-copy">Sign in to explore the people periodic table.</p>
        <p id="login-error" class="login-error" role="alert" hidden></p>
        <button id="sign-in-button" class="google-button" type="button" disabled>
          <span class="google-icon-wrap" aria-hidden="true">
            <svg class="google-g" viewBox="0 0 48 48" role="img">
              <path fill="#4285F4" d="M43.6 24.5c0-1.4-.1-2.8-.4-4.1H24v7.8h11c-.5 2.5-2 4.7-4.2 6.1v5h6.8c4-3.7 6-8.7 6-14.8z" />
              <path fill="#34A853" d="M24 44c5.5 0 10.1-1.8 13.5-4.8l-6.8-5c-1.9 1.3-4.1 2-6.7 2-5.1 0-9.4-3.4-11-8H6v5.2C9.4 39.8 16.2 44 24 44z" />
              <path fill="#FBBC05" d="M13 28.2a12 12 0 0 1 0-8.4v-5.2H6a20 20 0 0 0 0 18.8z" />
              <path fill="#EA4335" d="M24 11.8c3 0 5.7 1 7.8 3.1l5.8-5.8C34.1 5.8 29.5 4 24 4 16.2 4 9.4 8.2 6 14.6l7 5.2c1.6-4.6 5.9-8 11-8z" />
            </svg>
          </span>
          <span>Sign in with Google</span>
        </button>
        <p id="login-hint" class="login-hint" aria-live="polite">Preparing Google sign-in…</p>
      </section>
    </main>

    <main id="app-view" class="app-view" hidden>
      <div id="scene-container" class="scene-container" aria-label="Interactive 3D people periodic table"></div>

      <header class="user-bar">
        <img id="user-picture" class="user-picture" alt="" hidden />
        <span id="user-name" class="user-name"></span>
        <button id="sign-out-button" class="sign-out-button" type="button">Sign out</button>
      </header>

      <div id="status-panel" class="status-panel" role="status" aria-live="polite" hidden>
        <span id="status-text"></span>
        <button id="status-action" class="status-action" type="button" hidden></button>
      </div>

      <nav class="layout-controls" aria-label="Card layout">
        <button class="layout-button is-active" type="button" data-layout="table" aria-pressed="true">Table</button>
        <button class="layout-button" type="button" data-layout="sphere" aria-pressed="false">Sphere</button>
        <button class="layout-button" type="button" data-layout="helix" aria-pressed="false">Helix</button>
        <button class="layout-button" type="button" data-layout="grid" aria-pressed="false">Grid</button>
      </nav>

      <aside class="color-legend" aria-label="Net worth color scale">
        <span>Low</span><span class="legend-gradient" aria-hidden="true"></span><span>High</span>
      </aside>
    </main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
